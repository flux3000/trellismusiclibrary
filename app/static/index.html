<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trellis</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <script>
    // Runs in <body>, not <head>: body does not exist while <head> is parsing.
    // The saved palette id goes straight onto <html> — it must be right on the
    // very first frame or the app repaints itself in front of the user.
    // Deliberately dumb: it validates nothing and knows nothing about which
    // schemes are light. An unknown or missing id lands on the bare :root
    // block in main.css, which is Cale, and app.js corrects the stored value
    // on boot against the real registry.
    ;(function () {
      var id = localStorage.getItem('trellisPalette')
      if (!id) {
        // One-time migration off the old two-value theme key. Written back so
        // this runs once, not every load.
        id = localStorage.getItem('trellisTheme') === 'light' ? 'steely' : 'cale'
        localStorage.setItem('trellisPalette', id)
      }
      document.documentElement.setAttribute('data-palette', id)
    })()
    if(localStorage.getItem('trellisSidebarCollapsed')==='1')document.body.classList.add('sidebar-collapsed')
  </script>

  <div id="login-screen" class="login-screen hidden">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-mark">T</div>
        <span class="logo-text">Trellis</span>
      </div>
      <form id="login-form" class="login-form" autocomplete="off" novalidate>
        <div class="form-group">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" autocomplete="off" spellcheck="false" />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" autocomplete="off" />
        </div>
        <div id="login-error" class="login-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-full" id="login-submit">Sign in</button>
      </form>
    </div>
  </div>

  <div id="app-shell" class="app-shell hidden">

    <header class="app-header" id="app-header">
      <div class="app-header-left">
        <span class="app-wordmark">Trellis</span>
        <div class="app-nav-btns">
          <button type="button" class="hdr-btn" id="nav-sidebar-toggle" title="Toggle sidebar" aria-label="Toggle sidebar" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
          </button>
          <button type="button" class="hdr-btn" id="nav-back" title="Back" aria-label="Back" disabled><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
          <button type="button" class="hdr-btn" id="nav-fwd" title="Forward" aria-label="Forward" disabled><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
        </div>

        <div class="lib-select-host" id="lib-select-host"></div>
      </div>

      <div class="app-header-center" id="search-bar">
        <div class="search-field">
          <span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></span>
          <input type="text" id="search-input" class="search-input"
                 placeholder="Search artists, musicians, venues, dates"
                 autocomplete="off" spellcheck="false"
                 role="combobox" aria-expanded="false" aria-autocomplete="list"
                 aria-controls="search-dropdown" />
          <button class="search-clear hidden" id="search-clear" title="Clear" tabindex="-1"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
          <kbd class="search-hint" id="search-hint">/</kbd>
        </div>
        <div class="search-dropdown hidden" id="search-dropdown" role="listbox"></div>
      </div>

      <div class="app-header-right">
        <div class="view-mode-toggle hidden" id="view-mode-toggle" role="group" aria-label="View mode">
          <button type="button" class="vm-opt" data-mode="admin" aria-pressed="false">Admin</button>
          <button type="button" class="vm-opt" data-mode="playback" aria-pressed="false">Playback</button>
        </div>

        <div class="hdr-user">
          <div class="user-chip">
            <div class="user-avatar" id="user-avatar">?</div>
            <span class="user-name" id="user-name">Loading...</span>
          </div>
          <button class="btn-icon" id="settings-btn" title="Settings"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg></button>
          <button class="btn-icon" id="logout-btn" title="Sign out"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg></button>
        </div>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-nav" id="sidebar-nav"></div>
    </aside>

    <div class="sidebar-resizer" id="sidebar-resizer" title="Drag to resize"></div>

    <div class="content-column">

      <div class="library-banner hidden" id="library-banner" role="status" aria-live="polite">
        <span class="library-banner-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span>
        <span class="library-banner-text" id="library-banner-text"></span>
        <button type="button" class="library-banner-btn" id="library-banner-recheck">Check again</button>
      </div>

      <main class="main-content" id="main-content">
        <div class="empty-state">
            <div class="empty-title">Select an artist to browse recordings</div>
        </div>
      </main>

    </div>

  </div>

  <div class="player-bar" id="player-bar">
    <div class="player-track-info" id="player-info">
      <div class="player-track-title" id="player-title">—</div>
      <div class="player-track-meta" id="player-meta">No track selected</div>
      <div class="player-track-rec" id="player-rec"></div>
    </div>
    <div class="player-center">
      <div class="player-controls">
        <button class="player-btn" id="btn-prev" title="Previous">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.971 4.285A2 2 0 0 1 21 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z"/><path d="M3 20V4"/></svg>
        </button>
        <button class="player-btn player-btn-play" id="btn-play" title="Play / Pause">
          <svg class="icon-play" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" width="15" height="15" style="display:none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></svg>
        </button>
        <button class="player-btn" id="btn-next" title="Next">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4v16"/><path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"/></svg>
        </button>
      </div>
      <div class="player-progress">
        <span class="player-time" id="time-current">0:00</span>
        <input type="range" class="progress-bar" id="progress-bar" min="0" max="100" value="0" step="0.1" />
        <span class="player-time" id="time-duration">0:00</span>
      </div>
    </div>
    <div class="player-right">
      <label class="skip-toggle" title="Skip announcements, banter &amp; tuning from playback queue">
        <input type="checkbox" class="skip-filter-cb" id="skip-filter-player" />
        <span class="skip-toggle-label">Skip Non-Music</span>
      </label>
      <span class="vol-sep"></span>
      <span class="vol-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></svg>
      </span>
      <input type="range" class="volume-bar" id="volume-bar" min="0" max="1" value="0.8" step="0.01" />
      <button class="player-btn airplay-btn" id="btn-airplay" title="AirPlay" style="display:none">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1"/><path d="m12 15 5 6H7Z"/></svg>
      </button>
    </div>
  </div>

  <audio id="audio-el" preload="none"></audio>

  <script src="/js/vendor/wavesurfer.min.js"></script>
  <script src="/js/notify.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/player.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/debug.js"></script>
  <script src="/js/update.js"></script>
</body>
</html>
