<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trellis</title>
  <link rel="stylesheet" href="/css/main.css" />
  <!-- apply saved theme + sidebar-collapse state before first paint to avoid
       a flash/snap once app.js loads (Ryan, 2026-08-23 — same treatment as
       fluxTheme above, for the same reason: both are per-machine display
       state that must be correct on the very first frame). -->
  <script>
    if(localStorage.getItem('fluxTheme')==='light')document.body.classList.add('theme-light')
    if(localStorage.getItem('fluxSidebarCollapsed')==='1')document.body.classList.add('sidebar-collapsed')
  </script>
</head>
<body>

  <!-- ── Login ──────────────────────────────────────────────────────────────── -->
  <div id="login-screen" class="login-screen hidden">
    <div class="login-card">
      <div class="login-logo">
        <!-- "Flux Audio" retired 2026-08-23 — Ryan decided on the rebrand
             (see CONTEXT.md / project_app_naming.md): everyday name Trellis,
             full name Trellis Music Library. Mark + text updated here first
             since the login screen is the other place besides the App Header
             that says the app's name out loud. -->
        <div class="logo-mark">T</div>
        <span class="logo-text">Trellis</span>
      </div>
      <form id="login-form" class="login-form" autocomplete="off" novalidate>
        <div class="form-group">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" autocomplete="off" spellcheck="false" />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" autocomplete="off" />
        </div>
        <div id="login-error" class="login-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-full" id="login-submit">Sign in</button>
      </form>
    </div>
  </div>

  <!-- ── App shell ──────────────────────────────────────────────────────────── -->
  <div id="app-shell" class="app-shell hidden">

    <!-- ── App header (2026-08-22) ────────────────────────────────────────
         Full width across the top, above BOTH the sidebar and the content —
         it is chrome for the whole window, not for the page. Three cells:
         wordmark + navigation on the left, the search field centred in the
         window, the view-mode toggle on the right.

         The centre cell is centred against the WINDOW, not against whatever
         is left over after the side cells — hence 1fr / auto / 1fr with equal
         side columns, so a longer wordmark or an extra nav button cannot
         nudge the search box off centre. -->
    <header class="app-header" id="app-header">
      <div class="app-header-left">
        <!-- Trellis is the decided name (Ryan, 2026-08-23 — see
             project_app_naming.md: everyday name "Trellis", full name for the
             App Store/trademark "Trellis Music Library"; "Flux Audio" is
             retired). This span is still a plain-text wordmark standing in
             for a designed mark — the NAME is final, the TYPOGRAPHY isn't. -->
        <span class="app-wordmark">Trellis</span>
        <div class="app-nav-btns">
          <!-- Home button removed 2026-08-23 — "My Library" in the sidebar is
               now itself a link to the same place (see renderSidebar), and two
               controls that both just go Home was the redundant half. -->
          <!-- Sidebar collapse/expand (2026-08-23, Ryan) — left of Back per his
               spec. Same icon idiom as the player-bar controls below: inline
               SVG, not a unicode glyph, so it's crisp and sized on purpose
               rather than however a given font happens to render a character.
               State lives in localStorage (see the head script above) and on
               <body class="sidebar-collapsed"> — wired in wireHeaderNav(). -->
          <button type="button" class="hdr-btn" id="nav-sidebar-toggle" title="Toggle sidebar" aria-label="Toggle sidebar" aria-pressed="false">
            <svg viewBox="0 0 16 14" width="16" height="14" fill="none" aria-hidden="true">
              <rect x="0.75" y="0.75" width="14.5" height="12.5" rx="2" stroke="currentColor" stroke-width="1.3"/>
              <rect x="0.75" y="0.75" width="5.5" height="12.5" rx="1.3" fill="currentColor" fill-opacity="0.55"/>
            </svg>
          </button>
          <button type="button" class="hdr-btn" id="nav-back" title="Back" aria-label="Back" disabled>←</button>
          <button type="button" class="hdr-btn" id="nav-fwd" title="Forward" aria-label="Forward" disabled>→</button>
        </div>
      </div>

      <div class="app-header-center" id="search-bar">
        <div class="search-field">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input type="text" id="search-input" class="search-input"
                 placeholder="Search acts, people, venues, dates…"
                 autocomplete="off" spellcheck="false"
                 role="combobox" aria-expanded="false" aria-autocomplete="list"
                 aria-controls="search-dropdown" />
          <button class="search-clear hidden" id="search-clear" title="Clear" tabindex="-1">✕</button>
          <kbd class="search-hint" id="search-hint">/</kbd>
        </div>
        <div class="search-dropdown hidden" id="search-dropdown" role="listbox"></div>
      </div>

      <div class="app-header-right">
        <!-- Which library am I looking at? Moved out of the sidebar 2026-08-22:
             it is a whole-app context switch (the theme flips, every list
             changes meaning), which puts it with the other context controls up
             here, not among the navigation links. Rendered by
             renderLibrarySelector(); empty and invisible with no remotes. -->
        <div class="lib-select-host" id="lib-select-host"></div>

        <!-- Admin / Playback (Ryan, 2026-08-21). Rendered hidden and revealed by
             JS only for roles that can edit — a listener has no mode to choose
             and never sees it. Playback is what a listener always gets, so the
             toggle doubles as a way to look at the app through their eyes. -->
        <div class="view-mode-toggle hidden" id="view-mode-toggle" role="group" aria-label="View mode">
          <button type="button" class="vm-opt" data-mode="admin" aria-pressed="false">Admin</button>
          <button type="button" class="vm-opt" data-mode="playback" aria-pressed="false">Playback</button>
        </div>

        <!-- Who am I, and the two things I might want to do about it. Came up
             from the sidebar footer 2026-08-22 — the sidebar is now a list of
             places in the library, and an account is not one of them. -->
        <div class="hdr-user">
          <div class="user-chip">
            <div class="user-avatar" id="user-avatar">?</div>
            <span class="user-name" id="user-name">Loading...</span>
          </div>
          <button class="btn-icon" id="settings-btn" title="Settings">⚙</button>
          <button class="btn-icon" id="logout-btn" title="Sign out">⎋</button>
        </div>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-nav" id="sidebar-nav"></div>
    </aside>

    <div class="sidebar-resizer" id="sidebar-resizer" title="Drag to resize"></div>

    <!-- The content column: drive banner above, page below. The search box
         moved up into the App Header on 2026-08-22 — it is chrome for the
         window, and it was never the Action Bar (which is per-view markup
         rendered inside five pages and absent from the Library landing page,
         so it could never host a global search box). -->
    <div class="content-column">

      <!-- Library drive status. Hidden while the drive is healthy, which is
           almost always, so it costs no vertical space in normal use. -->
      <div class="library-banner hidden" id="library-banner" role="status" aria-live="polite">
        <span class="library-banner-icon" aria-hidden="true">⚠</span>
        <span class="library-banner-text" id="library-banner-text"></span>
        <button type="button" class="library-banner-btn" id="library-banner-recheck">Check again</button>
      </div>

      <main class="main-content" id="main-content">
        <div class="empty-state">
          <div class="empty-icon">◈</div>
          <div class="empty-title">Select an artist to browse recordings</div>
        </div>
      </main>

    </div>

  </div>

  <!-- ── Player bar ─────────────────────────────────────────────────────────── -->
  <div class="player-bar" id="player-bar">
    <div class="player-track-info" id="player-info">
      <div class="player-track-title" id="player-title">—</div>
      <div class="player-track-meta" id="player-meta">No track selected</div>
      <div class="player-track-rec" id="player-rec"></div>
    </div>
    <div class="player-center">
      <div class="player-controls">
        <button class="player-btn" id="btn-prev" title="Previous">
          <svg viewBox="0 0 18 14" fill="currentColor"><rect x="0" y="0" width="2.5" height="14"/><polygon points="18,0 5,7 18,14"/></svg>
        </button>
        <button class="player-btn player-btn-play" id="btn-play" title="Play / Pause">
          <svg class="icon-play" viewBox="0 0 12 14" fill="currentColor"><polygon points="0,0 12,7 0,14"/></svg>
          <svg class="icon-pause" viewBox="0 0 12 14" fill="currentColor" style="display:none"><rect x="0" y="0" width="4" height="14"/><rect x="8" y="0" width="4" height="14"/></svg>
        </button>
        <button class="player-btn" id="btn-next" title="Next">
          <svg viewBox="0 0 18 14" fill="currentColor"><polygon points="0,0 13,7 0,14"/><rect x="15.5" y="0" width="2.5" height="14"/></svg>
        </button>
      </div>
      <div class="player-progress">
        <span class="player-time" id="time-current">0:00</span>
        <input type="range" class="progress-bar" id="progress-bar" min="0" max="100" value="0" step="0.1" />
        <span class="player-time" id="time-duration">0:00</span>
      </div>
    </div>
    <div class="player-right">
      <label class="skip-toggle" title="Skip announcements, banter &amp; tuning from playback queue">
        <input type="checkbox" class="skip-filter-cb" id="skip-filter-player" />
        <span class="skip-toggle-track"></span>
        <span class="skip-toggle-label">Skip non-music</span>
      </label>
      <span class="vol-sep"></span>
      <span class="vol-icon">&#128266;</span>
      <input type="range" class="volume-bar" id="volume-bar" min="0" max="1" value="0.8" step="0.01" />
    </div>
  </div>

  <audio id="audio-el" preload="none"></audio>

  <script src="/js/vendor/wavesurfer.min.js"></script>
  <script src="/js/vendor/wavesurfer-zoom.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/player.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/debug.js"></script>
</body>
</html>
