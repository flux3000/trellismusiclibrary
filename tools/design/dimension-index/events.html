: 44, "name": "New Orleans Jazz & Heritage Festival", "text": "", "venue": "Fair Grounds Race Course", "place": "New Orleans, LA", "date": "May 5", "year": 2002, "key": 20020505, "lineup": ["Corey Harris"], "nartists": 1, "recs": 1, "shows": 1, "y0": 2002, "y1": 2002, "img": null}, {"id": 3, "name": "Nice Jazz Festival", "text": "", "venue": "Jardins de Cimiez", "place": "Nice", "date": "Jul 24", "year": 2010, "key": 20100724, "lineup": ["Pat Metheny Group"], "nartists": 1, "recs": 1, "shows": 1, "y0": 2010, "y1": 2010, "img": null}, {"id": 38, "name": "North Sea Jazz Festival", "text": "", "venue": "Congresgebouw", "place": "The Hague", "date": "Jul 16-13", "year": 2000, "key": 20000716, "lineup": ["D'Angelo & the Soultronics", "Esbjörn Svensson Trio"], "nartists": 2, "recs": 2, "shows": 2, "y0": 2000, "y1": 2007, "img": null}, {"id": 53, "name": "Northwest String Summit", "text": "", "venue": "Horning’s Hideout", "place": "North Plains, OR", "date": "Aug 26", "year": 2006, "key": 20060826, "lineup": ["Darol Anger's Republic of Strings"], "nartists": 1, "recs": 1, "shows": 1, "y0": 2006, "y1": 2006, "img": null}, {"id": 30, "name": "River City Bluegrass Festival", "text": "", "venue": "Oregon Convention Center", "place": "Portland, OR", "date": "Jan 7", "year": 2006, "key": 20060107, "lineup": ["River City Dream Band"], "nartists": 1, "recs": 1, "shows": 1, "y0": 2006, "y1": 2006, "img": null}, {"id": 49, "name": "Rockygrass", "text": "", "venue": "Rockygrass", "place": "Lyons, CO", "date": "Aug 1 - Jul 27", "year": 1997, "key": 19970801, "lineup": ["Rockygrass Thunder Jam", "Rockygrass House Band", "Blue Highway", "Rockygrass Late Night Jam"], "nartists": 5, "recs": 6, "shows": 6, "y0": 1997, "y1": 2007, "img": null}, {"id": 2, "name": "Summer Jam at Watkins Glen", "text": "", "venue": "Watkins Glen Grand Prix Raceway (Race Course)", "place": "Watkins Glen, NY", "date": "Jul 28", "year": 1973, "key": 19730728, "lineup": ["Allman Brothers Band"], "nartists": 1, "recs": 1, "shows": 1, "y0": 1973, "y1": 1973, "img": null}, {"id": 54, "name": "Suwannee Springfest", "text": "", "venue": "Spirit of the Suwannee Music Park", "place": "Live Oak, FL", "date": "Mar 27-26", "year": 2004, "key": 20040327, "lineup": ["Darol Anger's Republic of Strings", "Tony Rice Unit"], "nartists": 2, "recs": 2, "shows": 2, "y0": 2004, "y1": 2006, "img": null}, {"id": 48, "name": "Telluride Bluegrass Festival", "text": "", "venue": "Town Park", "place": "Telluride, CO", "date": "Jun 22-18", "year": 1985, "key": 19850622, "lineup": ["Chris Thile", "Hot Rize", "Alison Krauss & Union Station", "David Grisman Quartet"], "nartists": 16, "recs": 32, "shows": 31, "y0": 1985, "y1": 2026, "img": {"ext": ".webp", "origin": "upload", "credit": null}}, {"id": 50, "name": "Umeå Jazz Festival", "text": "", "venue": "Studion, Folkets Hus", "place": "Umea", "date": "Oct 28", "year": 1995, "key": 19951028, "lineup": ["Esbjörn Svensson & Lina Syberg"], "nartists": 1, "recs": 1, "shows": 1, "y0": 1995, "y1": 1995, "img": null}, {"id": 35, "name": "WAMU Bluegrass Winter Festival", "text": "", "venue": "Lisner Auditorium", "place": "Washington, DC", "date": "Feb 27", "year": 1983, "key": 19830227, "lineup": ["Seldom Scene"], "nartists": 1, "recs": 1, "shows": 1, "y0": 1983, "y1": 1983, "img": null}];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
const initials=n=>String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const years=(a,b)=>!a?'':(!b||a===b)?String(a):`${a}-${b}`;
const byName=(a,b)=>(a.sort||a.name).localeCompare(b.sort||b.name);
const inkOn=hex=>{if(!/^#[0-9a-f]{6}$/i.test(hex||''))return 'var(--t0)';
  const n=parseInt(hex.slice(1),16),f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};
  const L=.2126*f(n>>16)+.7152*f(n>>8&255)+.0722*f(n&255);return L>.4?'#141210':'#ffffff'};
document.getElementById('pal').addEventListener('change',e=>document.documentElement.setAttribute('data-palette',e.target.value));
document.getElementById('pal').value='cale';

/* photo with fallback underneath. Place files at photos/<kind>/<id>.<ext>
   (see README); a missing file just leaves the fallback showing. */
function art(d,kind,color){
  const f=`<span class="dx-ini">${esc(initials(d.name))}</span>`;
  const im=d.img?`<img src="photos/${kind}/${d.id}${esc(d.img.ext)}" alt="" loading="lazy" onerror="this.remove()">`:'';
  return `<span class="dx-art"${color?` style="--dx-fg:${esc(color)}"`:''}>${f}${im}</span>`;
}
function photo(d,kind){
  if(!d.img)return '';
  return `<span class="dx-photo"><img src="photos/${kind}/${d.id}${esc(d.img.ext)}" alt="" loading="lazy" onerror="this.parentNode.remove()"></span>`;
}

/* cfg: title, rows, row(d)->html, sorts[{id,label,cmp}], search(d)->string,
   filter{label,get(d)} optional, group{sort,key(d),label(d)} optional */
function run(cfg){
  let sortId=cfg.sorts[0].id,q='',fv='';
  const opts=cfg.filter?[...new Set(cfg.rows.map(cfg.filter.get).filter(Boolean))].sort():[];
  document.getElementById('page').innerHTML=`
   <h1 class="dx-title">${esc(cfg.title)}</h1>
   <div class="dim-bar">
     <input class="dim-search" id="q" placeholder="Filter ${esc(cfg.title.toLowerCase())}…" autocomplete="off">
     <div class="dim-sorts" id="sorts">${cfg.sorts.map(s=>`<button class="dim-sort${s.id===sortId?' active':''}" data-s="${s.id}">${esc(s.label)}</button>`).join('')}</div>
     ${cfg.filter?`<select class="dx-select" id="f"><option value="">${esc(cfg.filter.label)}</option>${opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`:''}
     <span class="dim-count" id="n"></span>
   </div><div id="out"></div>`;
  function paint(){
    const t=q.trim().toLowerCase();
    let r=cfg.rows.filter(d=>(!t||cfg.search(d).toLowerCase().includes(t))&&(!fv||cfg.filter.get(d)===fv));
    r=r.slice().sort(cfg.sorts.find(s=>s.id===sortId).cmp);
    let h='';
    if(cfg.group&&cfg.group.sort===sortId){
      const gs=[];r.forEach(d=>{const k=cfg.group.key(d);let g=gs[gs.length-1];if(!g||g.k!==k){g={k,l:cfg.group.label(d),rows:[]};gs.push(g)}g.rows.push(d)});
      h=gs.map(g=>`<section class="dx-group"><div class="dx-gutter">${esc(g.l)}</div><div class="dx-list">${g.rows.map(cfg.row).join('')}</div></section>`).join('');
    }else h=`<div class="dx-list">${r.map(cfg.row).join('')}</div>`;
    document.getElementById('out').innerHTML=r.length?h:`<div class="dim-empty">Nothing matches.</div>`;
    document.getElementById('n').textContent=(t||fv)?`${r.length} of ${cfg.rows.length}`:'';
  }
  document.getElementById('q').addEventListener('input',e=>{q=e.target.value;paint()});
  document.getElementById('sorts').addEventListener('click',e=>{const b=e.target.closest('.dim-sort');if(!b)return;sortId=b.dataset.s;
    document.querySelectorAll('.dim-sort').forEach(x=>x.classList.toggle('active',x===b));paint()});
  if(cfg.filter)document.getElementById('f').addEventListener('change',e=>{fv=e.target.value;paint()});
  paint();
}

run({
  title:'Events', rows:DATA,
  row:d=>`<a class="dx-row dx-row--event" href="#/event/${d.id}">
    <span class="dx-body">
      ${d.date?`<div class="dx-date">${esc(d.date)}</div>`:''}
      <div class="dx-name">${esc(d.name)}</div>
      <div class="dx-sub">${esc([d.venue,d.place].filter(Boolean).join(', '))}</div>
      ${d.text?`<div class="dx-text">${esc(d.text)}</div>`:''}
      ${d.lineup.length?`<div class="dx-with">${esc(d.lineup.join(', '))}${d.nartists>4?` and ${d.nartists-4} more`:''}</div>`:''}
    </span>
    <span class="dx-end">${photo(d,KIND)}<span class="dx-side"><div class="dx-n">${d.recs}</div><div class="dx-nl">${d.recs===1?'Recording':'Recordings'}</div></span></span></a>`,
  sorts:[{id:'date',label:'Date',cmp:(a,b)=>(a.key||9e9)-(b.key||9e9)||byName(a,b)},{id:'name',label:'A-Z',cmp:byName},
         {id:'recs',label:'Recordings',cmp:(a,b)=>b.recs-a.recs||byName(a,b)}],
  search:d=>[d.name,d.venue,d.place,...d.lineup].join(' '),
  group:{sort:'date',key:d=>d.year||0,label:d=>d.year||''}
});

</script></body></html>
