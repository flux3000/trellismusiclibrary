const DATA=[{"id": 14, "name": "A Tribe Called Quest", "sort": null, "text": "A Tribe Called Quest was an American hip-hop group formed in Queens, New York in 1985, originally comprising rapper and main producer Q-Tip, rapper Phife Dawg, DJ and co-producer Ali Shaheed Muhammad, and rapper Jarobi White. The group took their name in 1988 and became a central force in the Native Tongues Posse. Jarobi White departed after their debut album, leaving the core trio to define alternative hip-hop throughout the 1990s.\n\nThe group pioneered the fusion of jazz samples and hip-hop, drawing from previously unutilized vintage recordings and collaborating with jazz luminaries like bassist Ron Carter. Their first five albums, particularly The Low End Theory and Midnight Marauders, established them as innovators of the jazz-rap subgenre with a sound that balanced introspective, socially conscious lyrics against intricately layered, sample-based production. The group disbanded in 1998 but sporadically reunited beginning in 2004 and continued touring into the 2010s.\n\nA Tribe Called Quest reunited in 2015 for a celebrated performance on The Tonight Show Starring Jimmy Fallon marking the 25th anniversary of their debut, which led to their final studio album We Got It from Here... Thank You 4 Your Service released in 2016. Phife Dawg passed away in March 2016 before the album's completion. The group continued performing through 2017 and became widely recognized as pioneers of alternative hip-hop and jazz-inflected rap that emphasized artistic integrity, clever wordplay, and cultural consciousness.", "genre": "Rap", "color": "#7d7f88", "area": "St. Albans, United States", "members": [], "nmembers": 0, "recs": 1, "shows": 1, "y0": 1998, "y1": 1998, "img": {"ext": ".jpg", "origin": "commons", "credit": "swimfinfan from Chicago · CC BY-SA 2.0 · via Wikimedia Commons"}}, {"id": 65, "name": "Aaron Parks Trio", "sort": null, "text": "", "genre": "Jazz", "color": "#6a7fb5", "area": "Seattle, United States", "members": ["Aaron Parks"], "nmembers": 1, "recs": 1, "shows": 1, "y0": 2018, "y1": 2018, "img": {"ext": ".jpg", "origin": "commons", "credit": "Svíčková · CC BY-SA 3.0 · via Wikimedia Commons"}}, {"id": 71, "name": "Acoustic All-Stars", "sort": null, "text": "The Acoustic All-Stars were a bluegrass all-star ensemble that performed live in the late 1980s, bringing together some of the genre's most accomplished musicians. The group featured guitarist and vocalist Tony Rice, mandolinist Sam Bush, dobro player Jerry Douglas, banjo virtuoso Béla Fleck, fiddler Stuart Duncan, and bass player Mark Schatz. These musicians came together for special live performances rather than as a permanent touring band, allowing them to showcase their improvisational prowess and interplay at its highest level.\n\nThe All-Stars became known for spirited, high-energy live sets that blended traditional and contemporary bluegrass material. Their performances were characterized by extended instrumental solos and showcases for individual players, with each musician given space to display their technical mastery and creative voice. The group's repertoire ranged from traditional tunes like \"Little Sadie\" and \"John Hardy\" to original compositions and newer material, with the musicians often engaging in playful banter and tuning breaks between numbers.\n\nDocumented performances include two nights at the Birchmere in Alexandria, Virginia in January 1988, which have circulated widely in the taper community. These soundboard recordings capture the energy and musicianship that defined the All-Stars' approach to live bluegrass performance, emphasizing the chemistry between six of acoustic music's finest players.", "genre": "Bluegrass & Traditional", "color": "#7a9a5b", "area": null, "members": ["Tony Rice", "Sam Bush", "Jerry Douglas", "Bela Fleck", "Stuart Duncan", "Mark Schatz"], "nmembers": 6, "recs": 6, "shows": 6, "y0": 1988, "y1": 2004, "img": {"ext": ".jpg", "origin": "upload", "credit": null}}, {"id": 47, "name": "Al Di Meola, John McLaughlin and Paco de Lucía", "sort": null, "text": "Al Di Meola, John McLaughlin, and Paco de Lucía formed a landmark acoustic guitar trio in early 1980, with Al Di Meola replacing Larry Coryell in an ensemble that McLaughlin and de Lucía had initiated the previous year. The trio represented a virtuosic fusion of three distinct musical traditions: jazz-fusion (McLaughlin and Di Meola) and flamenco (de Lucía), performed on unplugged acoustic guitars at a time when such \"unplugged\" settings were unconventional in jazz.\n\nThe ensemble toured extensively between 1980 and 1983, performing across North America and Europe. Their December 1980 performances at the Warfield Theatre in San Francisco—recorded on consecutive nights—became foundational documents of the collaboration. The first night's recording was released in 1981 as Friday Night in San Francisco, which became a best-selling live album. A second recording from the following evening remained unreleased for over four decades before appearing in 2022 as Saturday Night in San Francisco. Between these live performances, the trio recorded a studio album, Passion, Grace and Fire (1983). After 1983, the group remained inactive for thirteen years before reuniting briefly in 1996 for a world tour and the studio album The Guitar Trio.\n\nAs a live act, the trio was characterized by explosive virtuosity, rapid-fire soloing exchanges between guitarists, and an ability to blend flamenco passion with jazz improvisation and Latin rhythms. Each musician maintained a distinct tonal identity: Di Meola on steel-string Ovation, McLaughlin on nylon-string with a pick, and de Lucía playing finger-style in the flamenco tradition.", "genre": "Jazz", "color": "#6a7fb5", "area": null, "members": ["Al Di Meola", "John McLaughlin", "Paco de Lucía"], "nmembers": 3, "recs": 6, "shows": 6, "y0": 1981, "y1": 1996, "img": {"ext": ".png", "origin": "upload", "credit": null}}, {"id": 55, "name": "Ali Farka Touré", "sort": null, "text": "Ali Farka Touré was born in 1939 in the village of Kanau on the Niger River in northwestern Mali. Drawn to music from an early age despite his family's disapproval—he came from a noble, non-musical background in a culture where music was traditionally hereditary—he built his first guitar as a child and became a self-taught musician. During the 1960s and 1970s, he performed in cultural competitions and recorded at Radio Mali while also working as a farmer, maintaining the latter as his primary identity throughout his life.\n\nTouré's international profile grew gradually from the late 1980s onward, beginning with his acclaimed 1988 album and reaching broader recognition through high-profile collaborations including Talking Timbuktu with Ry Cooder (1994, Grammy Award winner) and In the Heart of the Moon with kora master Toumani Diabaté (2005). As a live performer, he was known for his guitar-driven sound featuring hypnotic, foot-stomping rhythms often played with minimal accompaniment. His music merged traditional Sonrai music and Malian idioms with elements of American blues, creating what became known as desert blues. He sang primarily in local languages and was sometimes called \"the African John Lee Hooker,\" though he resisted that comparison, arguing that African traditional music was the source rather than a derivative of blues.\n\nTouré remained rooted in his village of Niafunké throughout his career and served as mayor from 2004 until his death. He died on March 7, 2006, from bone cancer, leaving behind a recorded legacy of eight albums on World Circuit Records and three Grammy Awards. His final album, Savane, was released posthumously in 2006.", "genre": "World", "color": "#b06a8a", "area": "Tombouctou, Mali", "members": ["Ali Farka Touré"], "nmembers": 1, "recs": 1, "shows": 1, "y0": 1990, "y1": 1990, "img": {"ext": ".jpeg", "origin": "upload", "credit": null}}, {"id": 182, "name": "Art Blakey and the Jazz Messengers", "sort": null, "text": "", "genre": "Jazz", "color": "#6a7fb5", "area": "United States", "members": ["Art Blakey"], "nmembers": 1, "recs": 4, "shows": 4, "y0": 1959, "y1": 1981, "img": {"ext": ".jpg", "origin": "commons", "credit": "Roland Godefroy · CC BY 2.5 · via Wikimedia Commons"}}, {"id": 36, "name": "Bela Fleck & Jerry Douglas", "sort": null, "text": "The two legends have joined up on occasion for duet shows.", "genre": "Bluegrass & Traditional", "color": "#7a9a5b", "area": null, "members": ["Bela Fleck", "Jerry Douglas"], "nmembers": 2, "recs": 4, "shows": 3, "y0": 1998, "y1": 1998, "img": {"ext": ".jpg", "origin": "upload", "credit": null}}, {"id": 190, "name": "Big Boi", "sort": null, "text": "", "genre": "Rap", "color": "#7d7f88", "area": "Savannah, United States", "members": [], "nmembers": 0, "recs": 1, "shows": 1, "y0": 2004, "y1": 2004, "img": {"ext": ".jpg", "origin": "commons", "credit": "Utoks · CC BY 3.0 · via Wikimedia Commons"}}, {"id": 107, "name": "Bluegrass Album Band", "sort": null, "text": "", "genre": "Bluegrass & Traditional", "color": "#7a9a5b", "area": "United States", "members": [], "nmembers": 0, "recs": 4, "shows": 4, "y0": 1981, "y1": 1989, "img": {"ext": ".webp", "origin": "upload", "credit": null}}, {"id": 209, "name": "Broken Compass Bluegrass", "sort": null, "text": "", "genre": null, "color": null, "area": null, "members": [], "nmembers": 0, "recs": 1, "shows": 1, "y0": 2026, "y1": 2026, "img": {"ext": ".jpg", "origin": "upload", "credit": null}}, {"id": 32, "name": "Béla Fleck", "sort": null, "text": "Béla Fleck is an American virtuoso banjo player born in New York City who has fundamentally transformed the instrument beyond its traditional bluegrass roots. Inspired as a teenager by the bluegrass sounds of Earl Scruggs and Flatt on The Beverly Hillbillies television theme, Fleck took up the banjo in 1973 and subsequently studied with jazz-influenced banjo instructors including Tony Trischka. Early in his career, he played with the bluegrass fusion band Tasty Licks and later joined the progressive bluegrass outfit New Grass Revival, where he remained from 1982 to 1991. A prolific solo artist with a discography spanning decades, Fleck has explored bluegrass, jazz, classical, folk, and world music styles.\n\nIn 1988-1989, Fleck formed the genre-bending ensemble Béla Fleck and the Flecktones with bassist Victor Wooten, harmonica player and keyboardist Howard Levy, and percussionist Roy \"Future Man\" Wooten (Victor's brother), who plays synthesizer-based percussion. The group later added saxophonist Jeff Coffin. The Flecktones became known for groundbreaking fusions of acoustic and electronic instrumentation, drawing from jazz, funk, folk, and bluegrass traditions. The band has maintained an active touring schedule spanning three decades with periodic hiatuses, reuniting in 2009 and continuing through the present.\n\nAs a live performer, Fleck is recognized for virtuosic improvisation and genre-spanning musicianship. Whether performing with the Flecktones, as a solo artist, in collaborations with world-renowned musicians including Chick Corea, Zakir Hussain, and Edgar Meyer, or in smaller ensemble configurations, his performances are characterized by technical mastery and exploratory musical vision. Fleck has won 18 Grammy Awards and holds the distinction of being nominated in more categories than any other artist in Grammy history. He has also conducted major orchestral works as composer, appearing with symphony orchestras internationally.", "genre": "Bluegrass & Traditional", "color": "#7a9a5b", "area": "New York, United States", "members": ["Bela Fleck"], "nmembers": 1, "recs": 1, "shows": 1, "y0": 2006, "y1": 2006, "img": {"ext": ".jpeg", "origin": "upload", "credit": null}}, {"id": 13, "name": "Chick Corea Acoustic Quartet", "sort": null, "text": "", "genre": "Jazz", "color": "#6a7fb5", "area": "Chelsea, United States", "members": ["Chick Corea"], "nmembers": 1, "recs": 1, "shows": 1, "y0": 1996, "y1": 1996, "img": {"ext": ".jpeg", "origin": "upload", "credit": null}}, {"id": 173, "name": "Cypress Hill", "sort": null, "text": "Cypress Hill is an American hip-hop group formed in South Gate, California in 1988, originating from an earlier ensemble called DVX (Devastating Vocal Excellence). The core founding members are Sen Dog (Senen Reyes), B-Real (Louis Freese), and DJ Muggs (Lawrence Muggerud), with Mellow Man Ace (Ulpiano Sergio Reyes), one of the two Cuban-born brothers, departing the group early to pursue a solo career. Eric Bobo, a percussionist and son of jazz drummer Willie Bobo, officially joined as the fourth member in 1994, bringing Latin-influenced percussion and formerly having toured with the Beastie Boys.\n\nCypress Hill emerged as one of the first major Latino-American hip-hop groups to achieve platinum and multi-platinum album sales and gain mainstream recognition in West Coast rap. Their style blends West Coast hip-hop with psychedelic and stoner influences, gangsta rap elements, and Latin lyricism—bridging the gap between hard-core hip-hop and laid-back cannabis-themed aesthetics. The group's sonic identity is defined by B-Real's distinctive nasal vocal tone, Sen Dog's gruffer delivery, and DJ Muggs' slow, rolling bass-heavy production style featuring sample-based beats. They became the first major hip-hop group to prominently incorporate Spanish language and Latin slang in their lyrics.\n\nThe group achieved critical and commercial success through their first five studio albums, beginning with their 1991 self-titled debut and continuing through Black Sunday (1993), which debuted at number one on the Billboard 200. Throughout the 1990s, Cypress Hill built a broad fanbase by performing constantly across tours with rock acts like Rage Against the Machine and Red Hot Chili Peppers, and major touring festivals including Lollapalooza, Smokin' Grooves, and Woodstock 94. As a live act, they are known for engaging crowd participation, delivering consistent performances, and bringing rock instrumentation to supplement their hip-hop foundation during certain eras. The band continued releasing studio albums into the 2020s and remains actively touring as of 2026.", "genre": "Rap", "color": "#7d7f88", "area": "South Gate, United States", "members": ["B-Real", "DJ Muggs", "Sen Dog", "Eric Bobo"], "nmembers": 4, "recs": 3, "shows": 3, "y0": 1995, "y1": 2000, "img": {"ext": ".jpg", "origin": "commons", "credit": "Philgarlic · CC BY-SA 2.0 · via Wikimedia Commons"}}, {"id": 79, "name": "David Grisman Quintet", "sort": null, "text": "", "genre": "Acoustic Jazz & Newgrass", "color": "#5fa39a", "area": "United States", "members": ["David Grisman", "Tony Rice", "Darol Anger", "Mike Marshall"], "nmembers": 4, "recs": 9, "shows": 9, "y0": 1976, "y1": 2002, "img": {"ext": ".jpeg", "origin": "upload", "credit": null}}, {"id": 132, "name": "Doc Watson and Dr. John", "sort": null, "text": "", "genre": "Bluegrass & Traditional", "color": "#7a9a5b", "area": null, "members": ["Doc Watson", "Dr. John"], "nmembers": 2, "recs": 1, "shows": 1, "y0": 1986, "y1": 1986, "img": null}, {"id": 264, "name": "Flea & The Honora Band", "sort": null, "text": "", "genre": null, "color": null, "area": null, "members": [], "nmembers": 0, "recs": 1, "shows": 1, "y0": 2026, "y1": 2026, "img": {"ext": ".jpg", "origin": "upload", "credit": null}}, {"id": 120, "name": "Guy Clark", "sort": null, "text": "", "genre": "Americana & Country", "color": "#c08a4a", "area": "Monahans, United States", "members": ["Guy Clark"], "nmembers": 1, "recs": 1, "shows": 1, "y0": 1977, "y1": 1977, "img": {"ext": ".jpg", "origin": "commons", "credit": "William Wallace from Austin, TX, USA · CC BY 2.0 · via Wikimedia Commons"}}, {"id": 91, "name": "J.D. Crowe and the New South", "sort": null, "text": "<cite index=\"20-1\">J.D. Crowe & The New South is a bluegrass band formed in 1971 by banjo player J. D. Crowe</cite>, based in <cite index=\"27-4\">Lexington, Kentucky</cite>. <cite index=\"20-3,20-4,20-5\">The New South recorded and toured with a variety of different lineups, with one of the most notable lineup changes coming in 2002 when the entire band quit out of desire for a more active performing schedule, forming the band Wildfire. Crowe quickly found replacements (rehiring mandolinist/vocalist Dwight McCall and guitarist/vocalist Rickey Wasson who had both been members previously) and the New South continued a moderate performance schedule.</cite>\n\nThe band became nationally renowned through its most acclaimed lineup. <cite index=\"4-14\">By 1975, the band included Tony Rice on guitar and lead vocals, Ricky Skaggs on mandolin and tenor vocals, Jerry Douglas on dobro, and Bobby Slone on bass, in addition to Crowe on banjo and baritone vocals.</cite> <cite index=\"12-2,12-3\">Their influential 1975 album, widely hailed as the genesis of the modern bluegrass sound, featured classics like \"Old Home Place\" and \"Cryin' Holy,\" and was recently inducted into the Grammy® Hall of Fame and the Library of Congress National Recording Registry.</cite> <cite index=\"3-1\">Under Crowe's leadership, the group tested the limits of tradition-minded bluegrass culture by welcoming electric instruments and embracing songs from the folk and rock worlds.</cite>\n\nAs a live act, J.D. Crowe & The New South was known for technical precision and genre-blending repertoire. <cite index=\"22-2\">The popular New South served as a training ground for a number of superstars in country and bluegrass, especially Skaggs, Lawson, and Keith Whitley, who joined in the early 1980s.</cite> <cite index=\"26-7\">All of the musicians in the original lineup of the New South were acclaimed and would later go on to popular solo careers.</cite>", "genre": "Bluegrass & Traditional", "color": "#7a9a5b", "area": "United States", "members": ["J.D. Crowe", "Tony Rice", "Bobby Sloane", "Ricky Skaggs", "Jerry Douglas"], "nmembers": 5, "recs": 8, "shows": 8, "y0": 1974, "y1": 2003, "img": {"ext": ".jpg", "origin": "commons", "credit": "Lee Paxton · CC BY-SA 4.0 · via Wikimedia Commons"}}, {"id": 234, "name": "Jerry Garcia and David Grisman", "sort": null, "text": "", "genre": null, "color": null, "area": null, "members": ["Jerry Garcia", "David Grisman"], "nmembers": 2, "recs": 1, "shows": 1, "y0": 1991, "y1": 1991, "img": null}, {"id": 262, "name": "Lalah Hathaway", "sort": null, "text": "", "genre": null, "color": null, "area": "Chicago, United States", "members": [], "nmembers": 0, "recs": 1, "shows": 1, "y0": 2026, "y1": 2026, "img": {"ext": ".jpg", "origin": "commons", "credit": "Team Hathaway · CC BY-SA 4.0 · via Wikimedia Commons"}}, {"id": 160, "name": "Leo Kottke", "sort": null, "text": "<cite index=\"3-2\">Leo Kottke is an American acoustic guitarist</cite> and solo artist who has been performing continuously since the late 1960s. <cite index=\"3-1\">Born September 11, 1945</cite> in Athens, Georgia, <cite index=\"3-5,3-6\">Kottke was raised in 12 different states and as a youth was influenced by folk and delta blues music, notably that of Mississippi John Hurt.</cite>\n\n<cite index=\"3-3\">He is known for a fingerpicking style that draws on blues, jazz, and folk music, and for syncopated, polyphonic melodies.</cite> <cite index=\"3-4\">In concert, Kottke intersperses humorous and often bizarre monologues with vocal and instrumental selections from throughout his career, played solo on six- and 12-string guitars.</cite> <cite index=\"5-1\">Over the last 50 years, he has not been off the road for more than two months,</cite> establishing himself as one of the most prolific touring artists in American music.\n\n<cite index=\"5-5\">Key recordings from his career span solo gems including 1973's My Feet Are Smiling, 1981's Guitar Music, 1999's One Guitar, No Vocals, and 2004's Try and Stop Me, along with full-band collaborations and works in the 1980s and 1990s.</cite> <cite index=\"4-5,4-6\">He collaborated with Phish bassist Mike Gordon on the album Clone in 2002, with a follow-up album Sixty-Six Steps recorded in 2005.</cite> <cite index=\"1-4\">Online forums, guitar blogs, and social media groups share tunings, tablature, and bootleg setlists, treating his catalog like a rich field for study.</cite></cite>", "genre": "Americana & Country", "color": "#c08a4a", "area": "Athens, United States", "members": ["Leo Kottke"], "nmembers": 1, "recs": 4, "shows": 4, "y0": 1972, "y1": 1992, "img": {"ext": ".jpg", "origin": "commons", "credit": "Anthony Pepitone · CC BY-SA 3.0 · via Wikimedia Commons"}}, {"id": 289, "name": "Miles Davis Sextet", "sort": null, "text": "", "genre": null, "color": null, "area": "United States", "members": ["Miles Davis", "John Coltrane", "Cannonball Adderley", "Bill Evans", "Wynton Kelly", "Paul Chambers", "Jimmy Cobb"], "nmembers": 7, "recs": 2, "shows": 2, "y0": 1970, "y1": 1981, "img": {"ext": ".jpeg", "origin": "upload", "credit": null}}, {"id": 246, "name": "Pat Metheny and Terje Rypdal", "sort": null, "text": "", "genre": null, "color": null, "area": null, "members": [], "nmembers": 0, "recs": 1, "shows": 1, "y0": 1976, "y1": 1976, "img": null}, {"id": 207, "name": "Shakti", "sort": null, "text": "", "genre": null, "color": null, "area": "United Kingdom", "members": [], "nmembers": 0, "recs": 1, "shows": 1, "y0": 1976, "y1": 1976, "img": {"ext": ".jpg", "origin": "commons", "credit": "Ali-Khan · CC BY-SA 3.0 · via Wikimedia Commons"}}, {"id": 163, "name": "The Country Boys", "sort": null, "text": "Following the recording sessions for the Country Boys' debut album, the band changed its name to the Kentucky Colonels in September 1962, at the suggestion of country guitarist and friend Joe Maphis.", "genre": "Bluegrass & Traditional", "color": "#7a9a5b", "area": null, "members": ["Clarence White", "Roland White", "Eric White", "Leroy \"Mack\" McNees", "Billy Ray Lathum"], "nmembers": 5, "recs": 5, "shows": 5, "y0": 1959, "y1": 1962, "img": null}];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
const initials=n=>String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const years=(a,b)=>!a?'':(!b||a===b)?String(a):`${a}-${b}`;
const byName=(a,b)=>(a.sort||a.name).localeCompare(b.sort||b.name);
const inkOn=hex=>{if(!/^#[0-9a-f]{6}$/i.test(hex||''))return 'var(--t0)';
  const n=parseInt(hex.slice(1),16),f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};
  const L=.2126*f(n>>16)+.7152*f(n>>8&255)+.0722*f(n&255);return L>.4?'#141210':'#ffffff'};
document.getElementById('pal').addEventListener('change',e=>document.documentElement.setAttribute('data-palette',e.target.value));
document.getElementById('pal').value='cale';

/* photo with fallback underneath. Place files at photos/<kind>/<id>.<ext>
   (see README); a missing file just leaves the fallback showing. */
function art(d,kind,color){
  const f=`<span class="dx-ini">${esc(initials(d.name))}</span>`;
  const im=d.img?`<img src="photos/${kind}/${d.id}${esc(d.img.ext)}" alt="" loading="lazy" onerror="this.remove()">`:'';
  return `<span class="dx-art"${color?` style="--dx-fg:${esc(color)}"`:''}>${f}${im}</span>`;
}
function photo(d,kind){
  if(!d.img)return '';
  return `<span class="dx-photo"><img src="photos/${kind}/${d.id}${esc(d.img.ext)}" alt="" loading="lazy" onerror="this.parentNode.remove()"></span>`;
}

/* cfg: title, rows, row(d)->html, sorts[{id,label,cmp}], search(d)->string,
   filter{label,get(d)} optional, group{sort,key(d),label(d)} optional */
function run(cfg){
  let sortId=cfg.sorts[0].id,q='',fv='';
  const opts=cfg.filter?[...new Set(cfg.rows.map(cfg.filter.get).filter(Boolean))].sort():[];
  document.getElementById('page').innerHTML=`
   <h1 class="dx-title">${esc(cfg.title)}</h1>
   <div class="dim-bar">
     <input class="dim-search" id="q" placeholder="Filter ${esc(cfg.title.toLowerCase())}…" autocomplete="off">
     <div class="dim-sorts" id="sorts">${cfg.sorts.map(s=>`<button class="dim-sort${s.id===sortId?' active':''}" data-s="${s.id}">${esc(s.label)}</button>`).join('')}</div>
     ${cfg.filter?`<select class="dx-select" id="f"><option value="">${esc(cfg.filter.label)}</option>${opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`:''}
     <span class="dim-count" id="n"></span>
   </div><div id="out"></div>`;
  function paint(){
    const t=q.trim().toLowerCase();
    let r=cfg.rows.filter(d=>(!t||cfg.search(d).toLowerCase().includes(t))&&(!fv||cfg.filter.get(d)===fv));
    r=r.slice().sort(cfg.sorts.find(s=>s.id===sortId).cmp);
    let h='';
    if(cfg.group&&cfg.group.sort===sortId){
      const gs=[];r.forEach(d=>{const k=cfg.group.key(d);let g=gs[gs.length-1];if(!g||g.k!==k){g={k,l:cfg.group.label(d),rows:[]};gs.push(g)}g.rows.push(d)});
      h=gs.map(g=>`<section class="dx-group"><div class="dx-gutter">${esc(g.l)}</div><div class="dx-list">${g.rows.map(cfg.row).join('')}</div></section>`).join('');
    }else h=`<div class="dx-list">${r.map(cfg.row).join('')}</div>`;
    document.getElementById('out').innerHTML=r.length?h:`<div class="dim-empty">Nothing matches.</div>`;
    document.getElementById('n').textContent=(t||fv)?`${r.length} of ${cfg.rows.length}`:'';
  }
  document.getElementById('q').addEventListener('input',e=>{q=e.target.value;paint()});
  document.getElementById('sorts').addEventListener('click',e=>{const b=e.target.closest('.dim-sort');if(!b)return;sortId=b.dataset.s;
    document.querySelectorAll('.dim-sort').forEach(x=>x.classList.toggle('active',x===b));paint()});
  if(cfg.filter)document.getElementById('f').addEventListener('change',e=>{fv=e.target.value;paint()});
  paint();
}

run({
  title:'Artists', rows:DATA,
  row:d=>`<a class="dx-row dx-row--artist" href="#/artist/${d.id}" style="--dx-fg:${esc(d.color||'')}">
    ${art(d,KIND,d.color)}
    <span class="dx-body">
      <div class="dx-name">${esc(d.name)}</div>
      <div class="dx-sub">${d.genre?`<span class="dx-sw"></span>${esc(d.genre)}`:''}${d.genre&&d.area?' · ':''}${esc(d.area||'')}</div>
      ${d.text?`<div class="dx-text">${esc(d.text)}</div>`:''}
      ${d.members.length?`<div class="dx-with"><b>${d.nmembers>d.members.length?'':''}</b>${esc(d.members.slice(0,5).join(', '))}${d.nmembers>5?` and ${d.nmembers-5} more`:''}</div>`:''}
    </span>
    <span class="dx-side"><div class="dx-n">${d.recs}</div><div class="dx-nl">${d.recs===1?'Recording':'Recordings'}</div>
      <div class="dx-span">${years(d.y0,d.y1)}</div></span></a>`,
  sorts:[{id:'name',label:'A-Z',cmp:byName},{id:'recs',label:'Recordings',cmp:(a,b)=>b.recs-a.recs||byName(a,b)},
         {id:'old',label:'Earliest',cmp:(a,b)=>(a.y0||9999)-(b.y0||9999)||byName(a,b)}],
  search:d=>[d.name,d.genre,d.area,...d.members].join(' '),
  filter:{label:'All genres',get:d=>d.genre}
});

</script></body></html>
