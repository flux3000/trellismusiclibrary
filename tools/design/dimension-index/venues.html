<link rel="stylesheet" href="../../../app/static/css/main.css">

</head><body class="dx-mock">

<main class="dx-page" id="page"></main>
<script>
const KIND="venues";
const DATA=[{"id": 242, "name": "328 Performance Hall", "city": "Nashville", "state": "TN", "country": "US", "text": "", "top": ["David Grisman & Tony Rice"], "nartists": 1, "recs": 1, "shows": 1, "y0": 1995, "y1": 1995, "img": null}, {"id": 328, "name": "Ash Grove", "city": "Los Angeles", "state": "CA", "country": "US", "text": "", "top": ["Kentucky Colonels"], "nartists": 1, "recs": 3, "shows": 3, "y0": 1965, "y1": 1965, "img": {"ext": ".webp", "origin": "upload", "credit": null}}, {"id": 470, "name": "Berklee Performance Center", "city": "Boston", "state": "MA", "country": "US", "text": "", "top": ["Pat Metheny Group", "Pat Metheny and Terje Rypdal"], "nartists": 2, "recs": 2, "shows": 2, "y0": 1976, "y1": 1980, "img": null}, {"id": 13, "name": "Capitol Theatre", "city": "Port Chester", "state": "NY", "country": "US", "text": "", "top": ["Khruangbin"], "nartists": 1, "recs": 1, "shows": 1, "y0": 2019, "y1": 2019, "img": null}, {"id": 546, "name": "Concertgebouw", "city": "Amsterdam", "state": null, "country": "Netherlands", "text": "", "top": ["Oscar Peterson Trio"], "nartists": 1, "recs": 2, "shows": 2, "y0": 1960, "y1": 1961, "img": {"ext": ".jpg", "origin": "upload", "credit": null}}, {"id": 259, "name": "Conservatory and School for the Arts", "city": "St Louis", "state": "MO", "country": "US", "text": "", "top": ["Doc Watson and Dr. John"], "nartists": 1, "recs": 1, "shows": 1, "y0": 1986, "y1": 1986, "img": null}, {"id": 535, "name": "De Roma", "city": "Antwerp", "state": null, "country": "Belgium", "text": "", "top": ["Mehliana"], "nartists": 1, "recs": 1, "shows": 1, "y0": 2013, "y1": 2013, "img": {"ext": ".jpg", "origin": "upload", "credit": null}}, {"id": 551, "name": "Falkoner Centret", "city": "Copenhagen", "state": null, "country": "Denmark", "text": "", "top": ["Oscar Peterson Trio"], "nartists": 1, "recs": 1, "shows": 1, "y0": 1968, "y1": 1968, "img": null}, {"id": 203, "name": "Gettysburg Bluegrass Festival", "city": "Gettysburg", "state": "PA", "country": "US", "text": "", "top": ["Alison Krauss & Union Station", "Tony Rice Unit"], "nartists": 2, "recs": 2, "shows": 2, "y0": 1994, "y1": 1995, "img": null}, {"id": 420, "name": "Higher Ground", "city": "South Burlington", "state": "VT", "country": "US", "text": "", "top": ["How To Grow A Band"], "nartists": 1, "recs": 1, "shows": 1, "y0": 2007, "y1": 2007, "img": null}, {"id": 548, "name": "Jazzfestival Bern", "city": "Bern", "state": null, "country": "Switzerland", "text": "", "top": ["Oscar Peterson"], "nartists": 1, "recs": 1, "shows": 1, "y0": 2000, "y1": 2000, "img": null}, {"id": 390, "name": "Lafayette Square", "city": "Buffalo", "state": "NY", "country": "US", "text": "", "top": ["Ben Folds"], "nartists": 1, "recs": 1, "shows": 1, "y0": 2002, "y1": 2002, "img": null}, {"id": 520, "name": "Ludlow Garage", "city": "Cincinnati", "state": "OH", "country": "US", "text": "", "top": ["Robert Glasper"], "nartists": 1, "recs": 1, "shows": 1, "y0": 2026, "y1": 2026, "img": {"ext": ".webp", "origin": "upload", "credit": null}}, {"id": 231, "name": "Merlefest Watson Stage", "city": "Wilkesboro", "state": "NC", "country": "US", "text": "", "top": ["Alison Brown and Her Fairweather Friends", "David Grisman & Tony Rice", "Hot Rize"], "nartists": 3, "recs": 3, "shows": 3, "y0": 1995, "y1": 2002, "img": null}, {"id": 70, "name": "Oakland Alameda County Coliseum", "city": "Oakland", "state": "CA", "country": "US", "text": "", "top": ["Crosby, Stills, Nash & Young"], "nartists": 1, "recs": 1, "shows": 1, "y0": 1974, "y1": 1974, "img": {"ext": ".webp", "origin": "upload", "credit": null}}, {"id": 446, "name": "Oakland Coliseum", "city": "Oakland", "state": "CA", "country": "US", "text": "", "top": ["Frank Sinatra"], "nartists": 1, "recs": 1, "shows": 1, "y0": 1968, "y1": 1968, "img": null}, {"id": 562, "name": "Piazza di Reforma", "city": "Lugano", "state": null, "country": "Switzerland", "text": "", "top": ["Keith Jarrett Trio"], "nartists": 1, "recs": 1, "shows": 1, "y0": 1986, "y1": 1986, "img": null}, {"id": 425, "name": "Rothvoss Farm - Main Stage", "city": null, "state": null, "country": null, "text": "", "top": ["Jerry Douglas Band", "Mountain Heart", "Blue Highway"], "nartists": 4, "recs": 4, "shows": 4, "y0": 2003, "y1": 2003, "img": null}, {"id": 572, "name": "Shinjuku Kohseinenkin Hall", "city": "Tokyo", "state": null, "country": "Japan", "text": "", "top": ["Miles Davis"], "nartists": 1, "recs": 1, "shows": 1, "y0": 1975, "y1": 1975, "img": null}, {"id": 201, "name": "Strawberry Park Bluegrass Festival", "city": "Preston", "state": "CT", "country": "US", "text": "", "top": ["Alison Krauss & Union Station"], "nartists": 1, "recs": 2, "shows": 2, "y0": 1991, "y1": 1991, "img": null}, {"id": 11, "name": "The Birchmere", "city": "Alexandria", "state": "VA", "country": "US", "text": "", "top": ["Tony Rice Unit", "Seldom Scene", "Acoustic All-Stars"], "nartists": 8, "recs": 20, "shows": 20, "y0": 1978, "y1": 1994, "img": {"ext": ".jpg", "origin": "upload", "credit": null}}, {"id": 342, "name": "The Cabale", "city": "Berkeley", "state": "CA", "country": "US", "text": "Was located at 2504 San Pablo Avenue in Berkeley, California", "top": ["Kentucky Colonels"], "nartists": 1, "recs": 4, "shows": 4, "y0": 1964, "y1": 1964, "img": null}, {"id": 309, "name": "The Couriers Folk Club", "city": "Leicester", "state": null, "country": "UK", "text": "", "top": ["Joni Mitchell"], "nartists": 1, "recs": 1, "shows": 1, "y0": 1967, "y1": 1967, "img": null}, {"id": 480, "name": "Tokyo International Forum Hall", "city": "Tokyo", "state": null, "country": "Japan", "text": "", "top": ["Pat Metheny Group"], "nartists": 1, "recs": 1, "shows": 1, "y0": 2005, "y1": 2005, "img": null}, {"id": 354, "name": "VPRO Radio", "city": "Hilversum", "state": null, "country": "Netherlands", "text": "", "top": ["Leo Kottke"], "nartists": 1, "recs": 1, "shows": 1, "y0": 1975, "y1": 1975, "img": null}];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
const initials=n=>String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const years=(a,b)=>!a?'':(!b||a===b)?String(a):`${a}-${b}`;
const byName=(a,b)=>(a.sort||a.name).localeCompare(b.sort||b.name);
const inkOn=hex=>{if(!/^#[0-9a-f]{6}$/i.test(hex||''))return 'var(--t0)';
  const n=parseInt(hex.slice(1),16),f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};
  const L=.2126*f(n>>16)+.7152*f(n>>8&255)+.0722*f(n&255);return L>.4?'#141210':'#ffffff'};
document.getElementById('pal').addEventListener('change',e=>document.documentElement.setAttribute('data-palette',e.target.value));
document.getElementById('pal').value='cale';

/* photo with fallback underneath. Place files at photos/<kind>/<id>.<ext>
   (see README); a missing file just leaves the fallback showing. */
function art(d,kind,color){
  const f=`<span class="dx-ini">${esc(initials(d.name))}</span>`;
  const im=d.img?`<img src="photos/${kind}/${d.id}${esc(d.img.ext)}" alt="" loading="lazy" onerror="this.remove()">`:'';
  return `<span class="dx-art"${color?` style="--dx-fg:${esc(color)}"`:''}>${f}${im}</span>`;
}
function photo(d,kind){
  if(!d.img)return '';
  return `<span class="dx-photo"><img src="photos/${kind}/${d.id}${esc(d.img.ext)}" alt="" loading="lazy" onerror="this.parentNode.remove()"></span>`;
}

/* cfg: title, rows, row(d)->html, sorts[{id,label,cmp}], search(d)->string,
   filter{label,get(d)} optional, group{sort,key(d),label(d)} optional */
function run(cfg){
  let sortId=cfg.sorts[0].id,q='',fv='';
  const opts=cfg.filter?[...new Set(cfg.rows.map(cfg.filter.get).filter(Boolean))].sort():[];
  document.getElementById('page').innerHTML=`
   <h1 class="dx-title">${esc(cfg.title)}</h1>
   <div class="dim-bar">
     <input class="dim-search" id="q" placeholder="Filter ${esc(cfg.title.toLowerCase())}…" autocomplete="off">
     <div class="dim-sorts" id="sorts">${cfg.sorts.map(s=>`<button class="dim-sort${s.id===sortId?' active':''}" data-s="${s.id}">${esc(s.label)}</button>`).join('')}</div>
     ${cfg.filter?`<select class="dx-select" id="f"><option value="">${esc(cfg.filter.label)}</option>${opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`:''}
     <span class="dim-count" id="n"></span>
   </div><div id="out"></div>`;
  function paint(){
    const t=q.trim().toLowerCase();
    let r=cfg.rows.filter(d=>(!t||cfg.search(d).toLowerCase().includes(t))&&(!fv||cfg.filter.get(d)===fv));
    r=r.slice().sort(cfg.sorts.find(s=>s.id===sortId).cmp);
    let h='';
    if(cfg.group&&cfg.group.sort===sortId){
      const gs=[];r.forEach(d=>{const k=cfg.group.key(d);let g=gs[gs.length-1];if(!g||g.k!==k){g={k,l:cfg.group.label(d),rows:[]};gs.push(g)}g.rows.push(d)});
      h=gs.map(g=>`<section class="dx-group"><div class="dx-gutter">${esc(g.l)}</div><div class="dx-list">${g.rows.map(cfg.row).join('')}</div></section>`).join('');
    }else h=`<div class="dx-list">${r.map(cfg.row).join('')}</div>`;
    document.getElementById('out').innerHTML=r.length?h:`<div class="dim-empty">Nothing matches.</div>`;
    document.getElementById('n').textContent=(t||fv)?`${r.length} of ${cfg.rows.length}`:'';
  }
  document.getElementById('q').addEventListener('input',e=>{q=e.target.value;paint()});
  document.getElementById('sorts').addEventListener('click',e=>{const b=e.target.closest('.dim-sort');if(!b)return;sortId=b.dataset.s;
    document.querySelectorAll('.dim-sort').forEach(x=>x.classList.toggle('active',x===b));paint()});
  if(cfg.filter)document.getElementById('f').addEventListener('change',e=>{fv=e.target.value;paint()});
  paint();
}

const loc=d=>[d.city,d.state,d.country].filter(Boolean).join(', ');
run({
  title:'Venues', rows:DATA,
  row:d=>`<a class="dx-row dx-row--venue" href="#/venue/${d.id}">
    <span class="dx-body">
      <div class="dx-name">${esc(d.name)}</div>
      <div class="dx-sub">${esc(loc(d))}</div>
      ${d.text?`<div class="dx-text">${esc(d.text)}</div>`:''}
      ${d.top.length?`<div class="dx-with">${esc(d.top.join(', '))}${d.nartists>3?` and ${d.nartists-3} more`:''}</div>`:''}
    </span>
    <span class="dx-end">${photo(d,KIND)}<span class="dx-side"><div class="dx-n">${d.recs}</div><div class="dx-nl">${d.recs===1?'Recording':'Recordings'}</div>
      <div class="dx-span">${years(d.y0,d.y1)}</div></span></span></a>`,
  sorts:[{id:'name',label:'A-Z',cmp:byName},{id:'recs',label:'Recordings',cmp:(a,b)=>b.recs-a.recs||byName(a,b)},
         {id:'place',label:'Place',cmp:(a,b)=>(a.country||'').localeCompare(b.country||'')||(a.state||'').localeCompare(b.state||'')||(a.city||'').localeCompare(b.city||'')||byName(a,b)}],
  search:d=>[d.name,d.city,d.state,d.country,...d.top].join(' '),
  filter:{label:'All countries',get:d=>d.country}
});

</script></body></html>
