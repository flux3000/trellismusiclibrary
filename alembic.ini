# For developers running `alembic revision --autogenerate` from the repo root.
# The app does not read this file: app/utils/db_upgrade.py builds its own Config.
[alembic]
script_location = app/migrations
prepend_sys_path = .
# Empty: env.py falls back to the database in config.py (TRELLIS_DB_PATH / TRELLIS_DATA_DIR).
sqlalchemy.url =
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
